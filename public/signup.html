<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Mistic Aura</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/auth.css"></head><body class="auth-page"><main class="auth-shell"><div class="auth-brand"><a class="logo" href="index.html">mistic aura<span>THE ART OF SLOW LIVING</span></a></div><section class="auth-card"><small class="eyebrow">BEGIN YOUR RITUAL</small><h1>Create your account.</h1><p>Your details stay with your Mistic Aura account so checkout is simpler next time.</p><div id="form-message" class="form-message"></div><form id="signup-form" class="auth-form"><div class="form-grid"><label>First name<input name="firstName" autocomplete="given-name" required></label><label>Last name<input name="lastName" autocomplete="family-name" required></label></div><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="12" autocomplete="new-password" required><small>Use at least 12 characters.</small></label><label>Confirm password<input name="confirmPassword" type="password" minlength="12" autocomplete="new-password" required></label><label class="auth-check"><input name="marketingOptIn" type="checkbox"> <span>Send me occasional Mistic Aura stories, new fragrances and offers.</span></label><button class="button" type="submit">Create account <span>→</span></button></form><div class="auth-links"><a href="login.html">Already have an account?</a><a href="index.html">Back home</a></div></section></main><script src="js/api.js"></script><script src="js/auth-pages.js"></script></body></html>
